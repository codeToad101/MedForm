function validateInit() {
    const first = document.querySelector("input[name='firstName']");
    const last = document.querySelector("input[name='lastName']");
    const mail = document.querySelector("input[name='email']");
    const ring = document.querySelector("input[name='phone']");

    if (!first.value.trim() || !last.value.trim() || !mail.value.trim() || !ring.value.trim()) {
        alert("Please complete all fields.");
        return;
    }

    nextQuestion(0);
}

function nextQuestion(num) {
    // hide current
    document.getElementById("q" + num).classList.remove("active");
    // show next
    document.getElementById("q" + (num + 1)).classList.add("active");
}
